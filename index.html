.bt{display:block}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:.06em}

.qn{font-size:13px;font-weight:600;color:var(--ac)}

.opt.on{border-color:var(--ac);background:rgba(154,106,58,.14)}

.go,.sec{display:block;width:100%;border-radius:10px;padding:13px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:6px}

.sec{background:transparent;color:var(--ct);border:2px solid var(--ct)}

<div id="app"></div>
<script>
const TARGET=50,DAY=1;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Day 1 content (from instructor's lessons) ---------- */
const cans=["I can dance.","I can cook.","I can drive a car.","I can write.","I can study.","I can read.","I can run.","You can help me.","You can speak English.","She can sing a song.","He can speak English.","They can walk.","We can speak English."];
const places=[["taxi","تاکسی"],["hotel","هتل"],["hospital","بیمارستان"],["pharmacy","داروخانه"],["supermarket","سوپرمارکت"],["mall","مرکز خرید"]];
const objs=[["pen","قلم"],["book","کتاب"],["notebook","دفتر"],["car","ماشین"],["cell phone","گوشی"],["water bottle","بطری آب"],["T-shirt","تی‌شرت"],["bag","کیف"],["suitcase","چمدان"]];

{t:"مثال‌های Where is / Where are",e:"برای یه چیز (مفرد) <span class='ltr'>Where is</span> و برای چند تا چیز (جمع) <span class='ltr'>Where are</span> می‌گیریم.",f:"Where is + my + اسم مفرد ؟<br>Where are + my + اسم جمع ؟",x:[["Where is it?","اون کجاست؟"],["Where is my notebook?","دفترم کجاست؟"],["Where is my cell phone?","گوشیم کجاست؟"],["Where is my water bottle?","بطری آبم کجاست؟"],["Where is my suitcase?","چمدونم کجاست؟"],["Where are my keys?","کلیدهام کجان؟"],["Where are my shoes?","کفش‌هام کجان؟"],["Where are my books?","کتاب‌هام کجان؟"]],n:""},
{t:"فرمول ۳: Where can I find ... ?",e:"وقتی می‌خوایم بپرسیم یه جا رو کجا می‌تونیم پیدا کنیم (مثلاً وقتی مسافریم). همون can همیشگیه: <span class='ltr'>Where can I find</span> یعنی «کجا می‌تونم پیدا کنم».",f:"Where can I find + a + مکان ؟",x:[["Where can I find a taxi?","کجا می‌تونم تاکسی پیدا کنم؟"],["Where can I find a hotel?","کجا می‌تونم هتل پیدا کنم؟"],["Where can I find a hospital?","کجا می‌تونم بیمارستان پیدا کنم؟"],["Where can I find a pharmacy?","کجا می‌تونم داروخانه پیدا کنم؟"],["Where can I find a supermarket?","کجا می‌تونم سوپرمارکت پیدا کنم؟"],["Where can I find a mall?","کجا می‌تونم مرکز خرید پیدا کنم؟"]],n:""},
{t:"فرمول ۴: فرودگاه ✈️",e:"این جمله‌ها رو توی فرودگاه استفاده می‌کنی.",f:"ببخشید ← کمک بخواه ← تشکر کن",x:[["Excuse me.","ببخشید"],["Can you help me, please?","می‌تونی کمکم کنی، لطفاً؟"],["Thank you so much.","خیلی ممنون"],["Where is baggage claim?","محل تحویل چمدون"],["Where is the restroom?","سرویس بهداشتی (the toilets)"],["Where is the exit?","خروجی (راه بیرون رفتن از فرودگاه)"],["Where can I find a taxi?","کجا می‌تونم تاکسی پیدا کنم؟"]],n:""}];
function lesson(){const p=FM[S.lp],last=S.lp===FM.length-1;return `<div class="top"><div class="brand"><span class="rx" role="img" aria-label="Rexy"></span><span class="bt">EZI PIZI<small>ENGLISH FOR REAL LIFE · REXY CLUB</small></span></div><div class="qn en">${S.lp+1} / ${FM.length}</div></div><div class="bar"><i style="width:${(S.lp+1)/FM.length*100}%"></i></div><main class="card"><div class="tag">📘 فرمول</div><h2>${ttl(p.t)}</h2><p>${p.e}</p>${fbox(p.f)}${p.x.map(x=>`<div class="lr"><span class="en">${x[0]}</span> — ${x[1]}</div>`).join("")}${p.n?`<p class="note">${p.n}</p>`:""}<button class="go" onclick="lgo(1)">${last?"شروع تمرین":"بعدی"}</button>${S.lp?`<button class="sec" onclick="lgo(-1)">قبلی</button>`:""}<button class="sec" onclick="lgo(9)">رد شدن به تمرین</button></main>`}
function lgo(d){if(d===9||S.lp+d>=FM.length){S.v="q"}else S.lp+=d;save();render()}
function formula(k){
 const F=t=>"فرمول: "+fx(t);
 if(/^Is it/.test(k))return F("Is it + my + اسم ؟");
 if(/^Where are/.test(k))return F("Where are + my + اسم جمع ؟");
 if(/^Where can I find/.test(k))return F("Where can I find + a + مکان ؟");
 if(/^Where is/.test(k))return F("Where is + my + اسم چیز ؟");
 if(/^Can .*\?$/.test(k))return F("Can + فاعل + فعل ساده ؟");
 if(/^(Yes|No), it /.test(k))return "جواب کوتاه: "+fx("Yes, it is. / No, it isn’t.");
 if(/^(Yes|No), /.test(k))return "جواب کوتاه: "+fx("Yes, ضمیر + can. / No, ضمیر + can’t.");
 if(/ can /.test(k))return F("فاعل + can + فعل ساده");
 return ""}
let VC=null;
function enVoices(){try{return speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang))}catch(e){return []}}
function pickVoice(){
 const vs=enVoices();
 const id=v=>v.name+" "+v.voiceURI;
 const mal=/(^|[^a-z])male|david|\bmark\b|\bguy\b|daniel|\balex\b|\bfred\b|george|james|ryan|aaron|gordon|rishi|eddy|reed|arthur|oliver|thomas|roger|brian|christopher|davis|\beric\b|-(iol|iom|tpd|rjs)\b/i;
 const isF=v=>/female/i.test(id(v))||!mal.test(id(v));
 const pref=[/samantha/i,/ava\b/i,/jenny/i,/aria/i,/zira/i,/serena/i,/karen/i,/moira/i,/tessa/i,/allison/i,/susan/i,/hazel/i,/libby/i,/sonia/i,/google us english/i,/female/i,/-(sfg|iob|iog|tpc|tpf|ald)\b/i];
 const rk=v=>/^en[-_]US/i.test(v.lang)?0:/^en[-_]GB/i.test(v.lang)?1:2;
 const fs=vs.filter(isF).sort((x,y)=>rk(x)-rk(y));
 for(const p of pref){const f=fs.find(v=>p.test(id(v)));if(f)return f}
 return fs[0]||null}
function mv(){if(!VC)VC=pickVoice();return VC}
try{speechSynthesis.addEventListener("voiceschanged",()=>{VC=pickVoice()})}catch(e){}
function sp(t,r){try{const u=new SpeechSynthesisUtterance(t),v=mv();u.lang="en-US";u.rate=r||.85;u.pitch=1.1;if(v){u.voice=v;u.lang=v.lang}else{const vs=enVoices(),d=vs.find(x=>/^en[-_]US/i.test(x.lang))||vs[0];if(d)u.voice=d}speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function say(r){sp(items[S.i].s.join(" "),r)}
function spO(k){sp(items[S.i].o[k].replace(/<[^>]+>/g,""))}
function spL(){sp(S.last.c.replace(/<[^>]+>/g,""))}
function why(c,k){
 if(/ cans /.test(c))return "بعد از can نباید s بیاد: <span class='ltr'>I cans ✗ ← I can ✓</span>.";
 if(/ can to /.test(c))return "بعد از can نباید to بیاد: <span class='ltr'>can to ✗ ← can ✓</span>.";
 if(/^Where is/.test(c)&&/^Where are/.test(k))return "اسم جمعه؛ برای جمع <span class='ltr'>Where are</span> می‌گیره: <span class='ltr'>Where are my keys?</span>";
 if(/^Is it/.test(c))return "<span class='ltr'>Is it ...?</span> یعنی «آیا این ... هست؟». برای پرسیدن مکان باید <span class='ltr'>Where is ...</span> بگی.";
 if(/^Where can I find/.test(c))return "اینجا مکان رو اشتباه گرفتی؛ به معنی فارسی سؤال دقت کن.";
 if(/can’t/.test(c))return "جواب «Yes» با can’t جور درنمیاد. بله: <span class='ltr'>Yes, I can.</span> / نه: <span class='ltr'>No, I can’t.</span>";
 if(/^Yes, I can\./.test(c)&&/he/.test(k))return "سؤال درباره‌ی Javid هست، پس باید با he جواب بدی، نه I.";
 return ""}
function rule(k){
 if(/^Where can I find/.test(k))return "<span class='ltr'>Where can I find a ...?</span> یعنی «کجا می‌تونم ... پیدا کنم؟»";
 if(/^Where is/.test(k))return "Where is ...? برای پرسیدن مکان.";
 if(/^Can you/.test(k))return "Can you ...? برای درخواست کمک.";
 if(/ can /.test(k))return "ساختار: فاعل + can + فعل ساده.";
 return ""}
function whyP(v,k){
 const cv=core(v),u=cv.split(" ").filter(Boolean),c=core(k).split(" "),ex=u.filter(w=>!c.includes(w)),mi=c.filter(w=>!u.includes(w)),m=[];
 if(!u.length)m.push("جوابت باید به انگلیسی باشه.");
 else{
  if(/\bcan to\b|\bcans\b/.test(cv))m.push("بعد از can نه to می‌آید و نه s.");
  if(ex.length)m.push("کلمه‌ی اشتباه یا اضافه: "+"<span class='ltr'>"+ex.join(", ")+"</span>"+".");
  if(mi.length)m.push("کلمه‌ی جا افتاده: "+"<span class='ltr'>"+mi.join(", ")+"</span>"+".");
  if(!ex.length&&!mi.length)m.push("ترتیب کلمه‌ها رو چک کن.")}
 return m.join(" ")+" "+formula(k)}
function nu(a){for(let i=a;i<items.length;i++)if(!S.r[i])return i;return -1}
function finish(){S.v=items.some((_,i)=>!S.r[i])?"sl":"end";save();render()}
function proceed(){const j=nu(S.i+1);if(j<0){finish();return}S.i=j;S.v="q";save();render()}
function next(){const i=S.i;S.cd=S.cd||{};if((i+1)%5===0&&i+1<items.length&&!S.cd[i]){S.cd[i]=1;S.cn=Math.random()<.5;S.v="cp";save();render();return}proceed()}
function go(i){if(S.v==="q"&&!S.r[S.i])S.fr=S.i;S.i=i;S.v=S.r[i]?"rv":"q";save();render()}
function skip(){S.sk=S.sk||{};S.sk[S.i]=1;proceed()}
function resumeQ(){const j=(S.fr!=null&&!S.r[S.fr])?S.fr:nu(0);if(j<0){finish();return}go(j)}

function rvw(){const it=items[S.i],L=S.r[S.i];return hd()+`<main class="card fb"><div class="tag">🔒 پاسخ ثبت شده؛ قابل تغییر نیست</div>${it.t==="r"?`<div class="say">${it.s.map(x=>`<div class="en">${x}</div>`).join("")}</div>`:`<p class="q">${it.q}</p>`}${L.ok===null?"":L.ok?"<h2>درست بود ✅</h2>":"<h2>اشتباه بود 🔁</h2>"}${L.u&&L.ok===false?`<p class="note">جوابت:</p><div class="ans" dir="ltr" style="text-align:left">${L.u}</div>`:""}${L.c?`<p class="note">جواب درست:</p><div class="ans en">${L.c}</div>`:""}${L.y?`<p class="note">${L.y}</p>`:""}<div class="lis nv">${S.i?`<button class="sec" onclick="go(${S.i-1})">← قبلی</button>`:""}${S.i<items.length-1?`<button class="sec" onclick="go(${S.i+1})">بعدی →</button>`:""}</div><button class="go" onclick="resumeQ()">ادامه‌ی تمرین</button></main>`}
function slw(){const u=items.map((_,i)=>i).filter(i=>!S.r[i]);return `<div class="top"><div class="brand"><span class="rx" role="img" aria-label="Rexy"></span><span class="bt">EZI PIZI<small>ENGLISH FOR REAL LIFE · REXY CLUB</small></span></div></div><div class="bar"><i style="width:100%"></i></div><main class="card"><h2>سؤال‌های بی‌پاسخ</h2><p>${u.length} سؤال رو جواب ندادی. می‌تونی برگردی و جوابشون بدی.</p>${u.map(i=>`<button class="sec" onclick="go(${i})">سؤال ${i+1}</button>`).join("")}<button class="go" onclick="fin()">پایان و دیدن نتیجه</button><p class="note">بعد از پایان، جواب‌ها قابل تغییر نیست.</p></main>`}
function cont(){proceed()}
function tp(s){
 if(/baggage|restroom|exit|Excuse|Thank|suitcase|toilets|way out/i.test(s))return "air";
 if(/^Where can I find/.test(s))return "find";
 if(/^Where is|^Where are|^Is it|^It is/.test(s))return "where";
 if(/^Can .*\?$|^(Yes|No), /.test(s))return "canq";
 if(/ can /.test(s))return "can";
 return ""}
const TL={can:"جمله‌های can",canq:"سؤال و جواب کوتاه با can",where:"پرسیدن جای چیزها (Where is)",find:"پیدا کردن مکان‌ها (Where can I find)",air:"عبارت‌های فرودگاه"};
function analyze(){
 const st={};S.r.forEach(x=>{if(x&&x.k&&x.ok!==null){const o=st[x.k]=st[x.k]||{n:0,g:0};o.n++;if(x.ok)o.g++}});
 const ks=Object.keys(st),good=ks.filter(k=>st[k].n>=2&&st[k].g/st[k].n>=.8),weak=ks.filter(k=>st[k].g/st[k].n<.6),
 rv=[...new Set(S.r.filter(x=>x&&x.w&&/[.?]$/.test(x.w)).map(x=>x.w))].slice(0,4),
 li=a=>a.map(k=>"• "+TL[k]+" ("+st[k].g+" از "+st[k].n+")");
 const sg=good.length?li(good):["تمرین رو تا آخر انجام دادی؛ این خودش بزرگ‌ترین نقطه‌ی قوته 💪"];
 const wk=weak.length?li(weak):["مورد مشخصی پیدا نشد؛ فقط مرور روزانه یادت نره."];
 const sm=["جمله‌ی can: "+fx("فاعل + can + فعل ساده"),"سؤال: "+fx("Can + فاعل + فعل ساده ؟"),"پرسیدن مکان: "+fx("Where is + my + اسم چیز ؟"),"پیدا کردن جا: "+fx("Where can I find + a + مکان ؟"),"فرودگاه: "+fx("Excuse me / Can you help me, please? / Thank you so much.")];
 const html=`<h2>نقاط قوت ✅</h2><p>${sg.join("<br>")}</p><h2>نیاز به تمرین 🔁</h2><p>${wk.join("<br>")}</p>${rv.length?`<p class="note">جمله‌هایی که مرور کن:</p>${rv.map(x=>`<div class="lr"><span class="en">${x}</span></div>`).join("")}`:""}<h2>فرمول‌های امروز 📘</h2><p>${sm.join("<br>")}</p><div class="ans">حتماً نتیجه‌ات رو برای آیما بفرست تا دسترسی‌ت به روز دوم باز بشه 🐰</div>`;
 const note=`Strengths: ${good.map(k=>TL[k]).join(" | ")||"-"}\nNeeds practice: ${weak.map(k=>TL[k]).join(" | ")||"-"}\nSentences to review: ${rv.join(" | ")||"-"}`;
 return{html,note}}

document.addEventListener("click",e=>{const t=e.target.closest("li,span.en,div.en");if(!t||!t.closest(".card"))return;const s=t.textContent.trim();if(/[A-Za-z]{2}/.test(s))sp(s)});
render();
