:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
:root{--bg:#F7EFE3;--tx:#102C43;--card:#FFFFFF;--ct:#102C43;--ac:#9A6A3A;--bt:#102C43;--bx:#F7EFE3;--ln:rgba(16,44,67,.22);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#102C43;--tx:#F7EFE3;--card:#F7EFE3}}
:root[data-theme="dark"]{--bg:#102C43;--tx:#F7EFE3;--card:#F7EFE3}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;font-size:16px}
#app{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.en{direction:ltr;unicode-bidi:isolate;text-align:left;display:inline-block}

.fx{direction:ltr;unicode-bidi:isolate;text-align:left}
.nv{direction:ltr}
.card .en .en::after{content:none}
select{width:100%;font:inherit;font-size:15px;padding:10px;border-radius:10px;border:2px solid var(--ln);background:#fff;color:#102C43;margin-bottom:8px;direction:ltr}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:10px}

.bt{display:block}
.brand small{display:block;font-weight:400;font-size:11px;opacity:.75;letter-spacing:.06em}
.time{display:flex;align-items:center;gap:8px;background:rgba(154,106,58,.14);border:1px solid var(--ac);border-radius:10px;padding:8px 12px;font-weight:600;margin:10px 0}
.qn{font-size:13px;font-weight:600;color:var(--ac)}
.bar{height:6px;border-radius:3px;background:var(--ln);overflow:hidden;margin-bottom:18px}
.bar i{display:block;height:100%;background:var(--ac)}
.card{background:var(--card);color:var(--ct);border-radius:14px;padding:20px 18px;border:1px solid var(--ln)}
.tag{font-size:13px;font-weight:600;color:var(--ac);margin-bottom:6px}
.q{font-size:18px;font-weight:600;margin:0 0 16px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:right;background:transparent;color:var(--ct);border:2px solid var(--ln);border-radius:10px;padding:12px 14px;margin-bottom:10px;font:inherit;font-size:17px;cursor:pointer}
.opt b{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border-radius:50%;border:1.5px solid var(--ct);font-size:13px;flex:none}
.opt.on{border-color:var(--ac);background:rgba(154,106,58,.14)}
.opt:focus-visible,.go:focus-visible,input:focus-visible,.sec:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.go,.sec{display:block;width:100%;border-radius:10px;padding:13px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;margin-top:6px}
.go{background:var(--bt);color:var(--bx);border:2px solid var(--bt)}
.go:disabled{opacity:.4;cursor:not-allowed}
.sec{background:transparent;color:var(--ct);border:2px solid var(--ct)}
input,textarea{width:100%;font:inherit;font-size:17px;padding:12px;border-radius:10px;border:2px solid var(--ln);background:#fff;color:#102C43;margin-bottom:10px;direction:ltr;text-align:left}
.say{background:rgba(154,106,58,.12);border-radius:10px;padding:14px;margin-bottom:12px;font-size:18px}
.say div{margin:2px 0}
.lr{margin:6px 0;font-size:17px}
.lis{display:flex;gap:8px;margin-bottom:6px}.lis .sec{margin-top:0}
.card span.en,.card div.en,.card li{cursor:pointer}
.fb{border-inline-start:5px solid var(--ac)}
.fb h2,.card h2{margin:0 0 8px;font-size:19px}
.ans{background:rgba(154,106,58,.12);border-radius:8px;padding:8px 12px;margin:10px 0;font-size:17px}
.note{font-size:13px;opacity:.8}
.le{margin:0 0 8px;font-size:15px;line-height:1.9;opacity:.9}
.lx{margin:4px 0 8px}
.lx .lr{margin:0;padding:9px 0;border-bottom:1px solid var(--ln);font-size:18px;line-height:1.5}
.lx .lr small{display:block;font-size:13px;opacity:.6;margin-top:1px}
.lx .lr.a{padding-inline-start:18px;font-size:16px;color:var(--ac)}
.lx .lr.a small{color:var(--ct)}
.lx .lr:has(+ .lr.a){border-bottom:none}
.lx .lr.a:has(+ .lr.a){border-bottom:none}
.card .lx .lr span.en::after{content:none}
.lx .lr:last-child{border-bottom:none}
:root{--sp:rgba(46,134,171,.15)}
.bar{direction:ltr}
.card span.en,.card div.en{background:var(--sp);border-radius:8px;padding:1px 8px}
.card .opt span.en{background:none;padding:0}
.card .ans.en{background:var(--sp);padding:8px 12px}
.card details ul{padding:0}
.card details li{list-style:none;background:var(--sp);border-radius:8px;padding:2px 10px;margin:5px 0}
details{margin:12px 0}summary{cursor:pointer;font-weight:600;color:var(--ac)}
details li{margin:3px 0}
ul{padding-inline-start:20px;margin:8px 0}
.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--ln)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ---- Rexy reactions · magic · coins · combo ---- */
:root{--bl:#2E86AB}
.cr{display:flex;align-items:center;gap:8px}
.snd{background:none;border:0;padding:2px 4px;margin:0;font-size:16px;line-height:1;cursor:pointer;color:inherit;border-radius:8px}
.snd:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.rt{direction:ltr;display:flex;flex:none;flex-direction:column;align-items:flex-start}.rt .qn{white-space:nowrap}
.coin{display:inline-block;font-size:14px;font-weight:600;line-height:1.5}
.coin.pop{animation:bump .6s ease-out}
.fire{display:inline-block;font-size:14px;font-weight:600;line-height:1.5}
.fire.in{animation:fin .6s cubic-bezier(.3,1.5,.5,1) both}
.fire.up{animation:bump .5s ease-out}
.fire.out{animation:fout 1.1s ease-out forwards}
@keyframes fin{0%{opacity:0;transform:scale(.3) translateY(6px)}100%{opacity:1;transform:none}}
@keyframes fout{0%{opacity:1}100%{opacity:.4;filter:grayscale(1);transform:scale(.9)}}
.fire.off{opacity:.4;filter:grayscale(1);transform:scale(.9)}
.fh{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.fh h2{margin:0}
.rw{display:block;position:relative;flex:none;width:60px;height:80px}
.rw .rx{display:block;position:relative;z-index:1;transform-origin:50% 100%;background-color:var(--card)}
.rw .rx.hop{animation:hop .85s ease-out both}
.rw .rx.tilt{animation:tilt .8s ease-in-out both}
.rw.g::before{content:"";position:absolute;inset:-14px;border-radius:50%;background:radial-gradient(circle,rgba(46,134,171,.5),rgba(46,134,171,0) 68%);opacity:0;animation:gl 1s ease-out}
.sp{position:absolute;left:50%;top:42%;z-index:2;border-radius:50%;opacity:0;pointer-events:none;animation:spk .8s ease-out forwards}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ct);border:1px solid var(--ac);background:rgba(154,106,58,.14);border-radius:999px;padding:1px 12px;animation:pop .45s ease-out both}
.chip.k{border-color:var(--bl);background:rgba(46,134,171,.14);animation-delay:.2s}
@keyframes hop{0%{transform:none}12%{transform:scale(1.07,.93)}42%{transform:translateY(var(--h,-16px)) scale(.97,1.04)}68%{transform:scale(1.05,.95)}84%{transform:translateY(calc(var(--h,-16px)/3))}100%{transform:none}}
@keyframes tilt{0%,100%{transform:none}25%{transform:rotate(-6deg)}60%{transform:rotate(4deg)}85%{transform:rotate(-2deg)}}
@keyframes gl{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.15)}}
@keyframes spk{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}20%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1)}}
@keyframes pop{0%{opacity:0;transform:translateY(6px) scale(.9)}60%{opacity:1;transform:translateY(-2px) scale(1.04)}100%{opacity:1;transform:none}}
@keyframes bump{35%{transform:scale(1.2)}100%{transform:none}}

/* ---- level map ---- */
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:24px 6px;direction:rtl;margin:10px 0 14px}
.lv{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:1;max-width:60px;margin:0 auto;border-radius:50%;border:2px solid var(--ct);background:transparent;color:var(--ct);font:inherit;font-weight:800;font-size:18px;line-height:1;padding:0;cursor:pointer;position:relative}
.lv i{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-style:normal;font-size:11px;color:#E8A317;letter-spacing:-1px;white-space:nowrap}
.lv.ok{background:var(--ct);color:var(--card)}
.lv.cur{background:var(--ac);border-color:var(--ac);color:#fff;animation:lvp 1.6s ease-in-out infinite}
.lv.lk{opacity:.4;border-style:dashed;font-size:15px}
.lv:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
@keyframes lvp{0%,100%{box-shadow:0 0 0 0 rgba(154,106,58,.5)}50%{box-shadow:0 0 0 8px rgba(154,106,58,0)}}
.stars{display:flex;justify-content:center;gap:6px;font-size:46px;line-height:1.1;margin:4px 0 6px;direction:ltr}
.stars span{color:#d8d2c6;animation:pop .5s ease-out both}
.stars span.on{color:#E8A317}
.shk{animation:shk .4s}
@keyframes shk{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
/* ---- journey, hearts, hint ---- */
.hnt{text-align:center;font-size:15px;font-weight:600;margin:0 0 12px}
.hp .lx .lr:first-child .en{animation:lvp 1.6s ease-in-out infinite}
.stop{display:flex;align-items:center;gap:12px;background:rgba(154,106,58,.12);border-radius:12px;padding:10px 12px;margin:10px 0}
.stop .se{font-size:30px;line-height:1}
.stop b{font-size:15px}
.stop .hr{margin-inline-start:auto;font-weight:600;font-size:14px;white-space:nowrap}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--ln);border:1px solid var(--ln)}
.dots i.p{background:#E8A317;border-color:#E8A317}
.dots i.c{background:var(--ac);border-color:var(--ac)}
.jm{position:relative;margin:6px 0 10px}
.jm svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.jm{background:linear-gradient(180deg,rgba(232,163,23,.12),rgba(154,106,58,.05) 55%,rgba(16,44,67,.07));border-radius:22px}
.jm path{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.jm .rd{stroke:rgba(154,106,58,.20);stroke-width:18}
.jm .up{stroke:var(--ac);stroke-width:3;stroke-dasharray:1 11;opacity:.7}
.jm .dn{stroke:#E8A317;stroke-width:7}
.pgr{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px;font-weight:700}
.pgb{flex:1;height:8px;border-radius:99px;background:var(--ln);overflow:hidden}
.pgb i{display:block;height:100%;background:#E8A317;border-radius:99px}
.nd .wr{position:relative;width:fit-content;margin:0 auto}
.nd .no{position:absolute;top:-4px;right:-8px;min-width:22px;height:22px;border-radius:99px;background:var(--ct);color:var(--card);font:800 11px/22px Vazirmatn,sans-serif;text-align:center;border:2px solid var(--card)}
.nd .lv{width:62px;height:62px;font-size:27px;border:3px solid #fff}
.nd .lv.ok{background:linear-gradient(160deg,#F6C453,#E8A317);color:#102C43;box-shadow:0 4px 0 #B97F0A}
.nd .lv.op{background:#fff;border-color:var(--ac);box-shadow:0 4px 0 rgba(154,106,58,.35)}
.nd .lv.cur{width:76px;height:76px;font-size:34px;background:linear-gradient(160deg,#B98150,#8A5A2B);border:4px solid #fff;color:#fff;box-shadow:0 5px 0 #6E4824,0 0 0 0 rgba(154,106,58,.5);animation:lvp 1.6s ease-in-out infinite}
.nd .lv.lk{opacity:1;background:#E4DED3;border:3px solid #F3EEE6;box-shadow:none;font-size:22px;filter:grayscale(.4)}
.nd .nl{display:inline-block;margin-top:8px;padding:1px 12px;background:var(--card);border:1px solid var(--ln);border-radius:99px;font-size:12px;font-weight:800;color:var(--ct)}
.nd .gs{font-size:14px;line-height:1;margin-top:3px}
.nd{position:absolute;transform:translate(-50%,-50%);text-align:center;width:110px}
.nd .lv{width:58px;max-width:none;font-size:24px}
.nd small{display:block;font-size:12px;font-weight:600;margin-top:4px;line-height:1.35}
.nd .gs{color:#E8A317;letter-spacing:-1px}
.jm .rxm{position:absolute;z-index:3;width:38px;height:50px;margin-left:-19px;margin-top:-50px;border-radius:14px 14px 0 0;background-color:var(--card);transition:left 1.1s cubic-bezier(.5,0,.3,1),top 1.1s cubic-bezier(.5,0,.3,1);animation:cfl 3s ease-in-out infinite;pointer-events:none}

<script>
const TARGET=79,DAY=1,COIN=10,BONUS=5,FIRE=3;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(7);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- Day 1 content: the original question set, ordered easy -> hard ---------- */
const cans=["I can dance.","I can cook.","I can drive a car.","I can write.","I can study.","I can read.","I can run.","You can help me.","You can speak English.","She can sing a song.","He can speak English.","They can walk.","We can speak English."];
const places=[["taxi","تاکسی"],["hotel","هتل"],["hospital","بیمارستان"],["pharmacy","داروخانه"],["supermarket","سوپرمارکت"],["mall","مرکز خرید"]];
const objs=[["pen","قلم"],["book","کتاب"],["notebook","دفتر"],["car","ماشین"],["cell phone","گوشی"],["water bottle","بطری آب"],["T-shirt","تی‌شرت"],["bag","کیف"],["suitcase","چمدان"]];
const plur=[["keys","کلیدهام"],["shoes","کفش‌هام"],["books","کتاب‌هام"]];
const O=(q,c,w,y)=>({t:"m",q,c,y,o:sh([c,w])});
const YC="بعد از can فعل ساده می‌آید؛ نه to، نه s.";
const cq=s=>{const i=cans.indexOf(s);return O("کدوم جمله درسته؟",s,i%2?s.replace(" can "," cans "):s.replace(" can "," can to "),YC)};

function formula(k){
 const F=t=>"فرمول: "+fx(t);
 if(/^Is it/.test(k))return F("Is it + my + اسم ؟");
 if(/^(It is|It’s) /.test(k))return F("It is + my + اسم");
 if(/^Where are/.test(k))return F("Where are + my + اسم جمع ؟");
 if(/^Where can I find/.test(k))return F("Where can I find + a + مکان ؟");
 if(/^Where is/.test(k))return F("Where is + my + اسم چیز ؟");
 if(/^Can .*\?$/.test(k))return F("Can + فاعل + فعل ساده ؟");
 if(/^(Yes|No), it /.test(k))return "جواب کوتاه: "+fx("Yes, it is. / No, it isn’t.");
 if(/^(Yes|No), /.test(k))return "جواب کوتاه: "+fx("Yes, ضمیر + can. / No, ضمیر + can’t.");
 if(/ can /.test(k))return F("فاعل + can + فعل ساده");
 return ""}

 const fs=vs.filter(isF).sort((x,y)=>rk(x)-rk(y));

function tp(s){
 if(/^Where (is|are) my /.test(s))return "where";
 if(/^Is it|^It is|^It’s/.test(s))return "isit";
 if(/^Can (I|you) .*\?$/.test(s))return "req";
 if(/baggage|restroom|exit|Excuse|Thank|suitcase|toilets|way out/i.test(s))return "air";
 if(/^Where can I find/.test(s))return "find";
 if(/^Where is|^Where are|^Is it|^It is/.test(s))return "where";
 if(/^Can .*\?$|^(Yes|No), /.test(s))return "canq";
 if(/ can /.test(s))return "can";
 return ""}
const TL={isit:"It is / Is it my…",req:"درخواست و اجازه (Can you / Can I)",can:"جمله‌های can",canq:"سؤال و جواب کوتاه با can",where:"پرسیدن جای چیزها (Where is)",find:"پیدا کردن مکان‌ها (Where can I find)",air:"عبارت‌های فرودگاه"};
function analyze(){
 const st={};S.r.forEach(x=>{if(x&&x.k&&x.ok!==null){const o=st[x.k]=st[x.k]||{n:0,g:0};o.n++;if(x.ok)o.g++}});
 const ks=Object.keys(st),good=ks.filter(k=>st[k].n>=2&&st[k].g/st[k].n>=.8),weak=ks.filter(k=>st[k].g/st[k].n<.6),
 rv=[...new Set(S.r.filter(x=>x&&x.w&&/[.?]$/.test(x.w)).map(x=>x.w))].slice(0,4),
 li=a=>a.map(k=>"• "+TL[k]+" ("+st[k].g+" از "+st[k].n+")");
 const sg=good.length?li(good):["تمرین رو تا آخر انجام دادی؛ این خودش بزرگ‌ترین نقطه‌ی قوته 💪🏻"];
 const wk=weak.length?li(weak):["مورد مشخصی پیدا نشد؛ فقط مرور روزانه یادت نره."];
 const sm=["جمله‌ی can: "+fx("فاعل + can + فعل ساده"),"سؤال: "+fx("Can + فاعل + فعل ساده ؟"),"درخواست و اجازه: "+fx("Can you ...? / Can I ...?"),"اون چیز: "+fx("It is + my + اسم · Is it + my + اسم ؟"),"پرسیدن مکان: "+fx("Where is + my + اسم چیز ؟"),"پیدا کردن جا: "+fx("Where can I find + a + مکان ؟"),"فرودگاه: "+fx("Excuse me / Can you help me, please? / Thank you so much.")];
 const html=`<h2>نقاط قوت ✅</h2><p>${sg.join("<br>")}</p><h2>نیاز به تمرین 🔁</h2><p>${wk.join("<br>")}</p>${rv.length?`<p class="note">جمله‌هایی که مرور کن:</p>${rv.map(x=>`<div class="lr"><span class="en">${x}</span></div>`).join("")}`:""}<h2>فرمول‌های امروز 📘</h2><p>${sm.join("<br>")}</p><div class="ans">حتماً نتیجه‌ات رو برای آیما بفرست تا دسترسی‌ت به روز دوم باز بشه 🐰</div>`;
 const note=`Strengths: ${good.map(k=>TL[k]).join(" | ")||"-"}\nNeeds practice: ${weak.map(k=>TL[k]).join(" | ")||"-"}\nSentences to review: ${rv.join(" | ")||"-"}`;
 return{html,note}}
